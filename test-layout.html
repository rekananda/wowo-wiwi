<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Card Game Table</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #2c3e50;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    #controls {
      margin: 20px;
      color: white;
    }

    #table {
      position: relative;
      width: 90vw;
      height: 90vh;
      background-color: #27ae60;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      overflow: visible;
    }

    .player {
      position: absolute;
      width: 190px;
      height: 190px;
      background-color: #3498db;
      color: white;
      text-align: center;
      line-height: 190px;
      font-weight: bold;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    @media (max-width: 768px) {
      #table {
        width: 100%;
        height: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        padding: 20px;
        background-color: transparent;
      }

      .player {
        position: static;
        transform: none;
        margin: 10px;
        width: 150px;
        height: 150px;
        line-height: 150px;
      }
    }
  </style>
</head>
<body>

<div id="controls">
  <label for="playerCount">Jumlah Pemain: </label>
  <select id="playerCount"></select>
</div>

<div id="table">
  <svg id="radiusLine" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1"></svg>
</div>

<script>
  const select = document.getElementById("playerCount");
  const table = document.getElementById("table");

  for (let i = 3; i <= 14; i++) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = i;
    select.appendChild(option);
  }

  function isMobile() {
    return window.innerWidth <= 768;
  }

  function getCirclePositions(count) {
    const padding = 110; // buffer so players don't go offscreen
    const radius = Math.min(table.offsetWidth, table.offsetHeight) / 2 - padding;
    const centerX = table.offsetWidth / 2;
    const centerY = table.offsetHeight / 2;
    const angleStep = (2 * Math.PI) / count;

    return Array.from({ length: count }, (_, i) => {
      const angle = angleStep * i - Math.PI / 2;
      return {
        top: centerY + radius * Math.sin(angle),
        left: centerX + radius * Math.cos(angle),
      };
    });
  }

  function drawRadiusLine(positions) {
    const svg = document.getElementById("radiusLine");
    svg.innerHTML = ""; // Clear previous line

    if (positions.length === 0) return;

    const centerX = table.offsetWidth / 2;
    const centerY = table.offsetHeight / 2;
    const first = positions[0];

    // SVG line
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", centerX);
    line.setAttribute("y1", centerY);
    line.setAttribute("x2", first.left);
    line.setAttribute("y2", first.top);
    line.setAttribute("stroke", "#fff");
    line.setAttribute("stroke-width", "3");
    line.setAttribute("stroke-dasharray", "8,6");

    svg.appendChild(line);
  }

  function renderPlayers(count) {
    table.innerHTML = "";
    if (isMobile()) {
      for (let i = 0; i < count; i++) {
        const div = document.createElement("div");
        div.className = "player";
        div.textContent = i + 1;
        table.appendChild(div);
      }
    } else {
      const positions = getCirclePositions(count);
      positions.forEach((pos, i) => {
        const div = document.createElement("div");
        div.className = "player";
        div.style.top = `${pos.top}px`;
        div.style.left = `${pos.left}px`;
        div.textContent = i + 1;
        table.appendChild(div);
      });
      drawRadiusLine(positions);
    }
  }

  // Initial
  select.value = "6";
  renderPlayers(6);

  select.addEventListener("change", () => {
    renderPlayers(parseInt(select.value));
  });

  window.addEventListener("resize", () => {
    renderPlayers(parseInt(select.value));
  });
</script>

</body>
</html>
