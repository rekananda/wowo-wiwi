<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Radial Stripes Generator</title>
  <style>
    body, html {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 8px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label for="stripeCount">Jumlah Stripe: </label>
    <input type="number" id="stripeCount" value="20" min="2" max="100" />
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const input = document.getElementById("stripeCount");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function drawStripes(stripeCount) {
      resizeCanvas();
      const { width, height } = canvas;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.sqrt(width * width + height * height); // agar penuh ke sudut

      const angle = (2 * Math.PI) / stripeCount;
      const startAngle = Math.PI/2; // mulai dari bawah (180 derajat)

      for (let i = 0; i < stripeCount; i++) {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(
          centerX,
          centerY,
          radius,
          startAngle + i * angle,
          startAngle + (i + 1) * angle
        );
        ctx.closePath();
        ctx.fillStyle = i % 2 === 0 ? "#f48fb1" : "#f8bbd0"; // dua warna pink
        ctx.fill();
      }
    }

    input.addEventListener("input", () => {
      const stripeCount = parseInt(input.value, 10);
      if (stripeCount >= 2) {
        drawStripes(stripeCount);
      }
    });

    window.addEventListener("resize", () => drawStripes(parseInt(input.value, 10)));

    // Initial render
    drawStripes(parseInt(input.value, 10));
  </script>
</body>
</html>
