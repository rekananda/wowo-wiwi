<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rasio 9:16</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    #outputBox {
      background-color: #2196F3;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Masukkan Lebar (px)</h2>
  <label for="width">Lebar (px): </label>
  <input type="number" id="width" step="0.1" /><br/><br/>
  <button onclick="ubahUkuran()">Terapkan</button>

  <div id="outputBox"></div>

  <script>
    function ubahUkuran() {
      const width = parseFloat(document.getElementById('width').value);
      const box = document.getElementById('outputBox');

      if (!isNaN(width)) {
        const height = width * 3 / 2;
        box.style.width = width + 'px';
        box.style.height = height + 'px';
        box.textContent = `Ukuran: ${width.toFixed(1)} x ${height.toFixed(1)} px`;
        box.style.color = 'white';
        box.style.display = 'flex';
        box.style.alignItems = 'center';
        box.style.justifyContent = 'center';
      } else {
        alert("Mohon masukkan angka yang valid.");
      }
    }
  </script>
</body>
</html>
